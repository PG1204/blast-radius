# Test configuration — takes precedence over src/main/resources/application.properties
# on the test classpath, so every value the app requires must be present here.
#
# Groq settings fall back to safe dummies so `./mvnw test` passes without any
# environment setup. When GROQ_API_KEY *is* exported, the real value wins, which
# is what gates and feeds the GoldenDiffTest regression suite.
spring.application.name=blast-radius

groq.api.key=${GROQ_API_KEY:test-dummy-key}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=qwen/qwen3-32b
