spring.application.name=blast-radius

groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=qwen/qwen3-32b

# Groq HTTP client tuning (all optional; defaults shown)
groq.api.connect-timeout-millis=5000
groq.api.read-timeout-millis=20000
groq.api.max-attempts=4

server.port=8090

# Actuator — expose health, info, metrics, and Prometheus scrape endpoint
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Blast Radius hardening (security)
# Shared secret required on /analysis/* (via X-API-Key or Authorization: Bearer).
# Blank disables auth — acceptable for local/dev only; ALWAYS set BLAST_RADIUS_API_KEY elsewhere.
blast-radius.api-key=${BLAST_RADIUS_API_KEY:}
# Reject request bodies larger than this many bytes with HTTP 413 (default 1 MiB).
blast-radius.max-request-bytes=1048576
# Maximum analyses in flight at once; excess requests get HTTP 429 (default 8).
blast-radius.max-concurrent-analyses=8
